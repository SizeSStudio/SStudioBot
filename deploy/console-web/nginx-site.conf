# Public entrance to the console (DESIGN §触5.1). Template: install.sh fills in __HOST__ and writes it to
# /etc/nginx/sites-available/sbot-console on the server (the host name is instance data, never in the repo).
# Same shape as the owner's other admin gate: TLS here (Let's Encrypt, webroot), DNS only at Cloudflare (grey cloud),
# login rate-limited per IP. Identity is decided by the core (password session cookie), not here: nginx passes no
# identity of its own, and it strips headers the console must never see from the client.

limit_req_zone $binary_remote_addr zone=sbot_console_login:1m rate=10r/m;

server {
  listen 80;
  server_name __HOST__;
  access_log off;
  location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name __HOST__;
  ssl_certificate /etc/letsencrypt/live/__HOST__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__HOST__/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;
  access_log off;
  client_max_body_size 1m;
  add_header Strict-Transport-Security "max-age=31536000" always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For "";
  # the core ignores these on this socket anyway; dropping them here is a second layer
  proxy_set_header Tailscale-User-Login "";
  proxy_set_header Tailscale-User-Name "";
  proxy_set_header Tailscale-User-Profile-Pic "";
  proxy_set_header Authorization "";

  location = /_auth {
    limit_req zone=sbot_console_login burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://unix:/run/sbot-web/console.sock:;
  }
  location = /api/events {
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_pass http://unix:/run/sbot-web/console.sock:;
  }
  location / {
    proxy_read_timeout 300s;
    proxy_pass http://unix:/run/sbot-web/console.sock:;
  }
}
