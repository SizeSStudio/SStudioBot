<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<title>SStudioBot 控制台</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell">
  <header class="rail">
    <div class="brand"><b>SStudioBot</b><span class="live" id="live"><i aria-hidden="true"></i><span>连接中</span></span></div>
    <nav class="areas" aria-label="主导航">
      <a href="#/inbox" data-area="inbox"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 13h4l2 3h4l2-3h4M5 5h14l1 8v6H4v-6z"/></svg><span>待办</span><b class="badge" hidden></b></a>
      <a href="#/sessions" data-area="sessions"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><span>会话</span><b class="badge" hidden></b></a>
      <a href="#/life" data-area="life"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span>生活</span></a>
      <a href="#/self" data-area="self"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg><span>它自己</span><b class="badge" hidden></b></a>
    </nav>
    <div class="who sub" id="who"></div>
  </header>
  <main id="main"><div class="empty">加载中…</div></main>
</div>
<dialog id="drawer" closedby="any" aria-labelledby="drawer-title">
  <div class="drawer-head"><h2 id="drawer-title" class="clip"></h2><div id="drawer-actions"></div><form method="dialog"><button class="btn small" autofocus>关闭</button></form></div>
  <div id="drawer-body"></div>
</dialog>
<div id="toasts" popover="manual" role="status" aria-live="polite"></div>
<script type="module" src="/lib/app.js"></script>
</body>
</html>
